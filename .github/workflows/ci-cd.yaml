name: CI-CD Pipeline

on:
  push:
    branches: ["dockerization"]     # ONLY runs on dockerization branch
  workflow_dispatch:                 # allow manual trigger from GitHub UI

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------
      # CHECK OUT SOURCE CODE
      # -------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------
      # PYTHON SETUP + TESTS
      # -------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings

      # -------------------------------------------
      # DEBUG ACR LOGIN SERVER
      # -------------------------------------------
      - name: Debug Registry Name
        run: echo "Registry = ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}"

      # -------------------------------------------
      # BUILD DOCKER IMAGE
      # -------------------------------------------
      - name: Build Docker image
        run: |
          IMAGE="${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/emerald-app:latest"
          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .

      # -------------------------------------------
      # LOGIN TO ACR
      # -------------------------------------------
      - name: Login to ACR
        run: |
          echo "${{ secrets.AZURE_REGISTRY_PASSWORD }}" | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} \
            -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      # -------------------------------------------
      # PUSH IMAGE
      # -------------------------------------------
      - name: Push image to ACR
        run: |
          IMAGE="${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/emerald-app:latest"
          echo "Pushing image: $IMAGE"
          docker push "$IMAGE"


  # =========================================================
  # DEPLOY TO AZURE WEB APP FOR CONTAINERS
  # =========================================================
  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------
      # LOGIN TO AZURE USING SERVICE PRINCIPAL
      # -------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------
      # DEBUG: WEB APP NAME
      # -------------------------------------------
      - name: Debug WebApp name
        run: echo "Deploying to WebApp = $AZURE_WEBAPP_NAME"
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}

      # -------------------------------------------
      # DEPLOY CONTAINER IMAGE
      # -------------------------------------------
      - name: Deploy to Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/emerald-app:latest
