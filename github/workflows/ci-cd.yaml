name: CI-CD Pipeline

on:
  push:
    branches: ["dockerization"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings

      # -------------------------------------------
      # BUILD DOCKER IMAGE WITH CORRECT NAME
      # -------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/emerald-app:latest \
            .

      # -------------------------------------------
      # AUTH TO ACR
      # -------------------------------------------
      - name: Login to ACR
        run: |
          echo "${{ secrets.AZURE_REGISTRY_PASSWORD }}" | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} \
            -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      # -------------------------------------------
      # PUSH LATEST TAG
      # -------------------------------------------
      - name: Push image to ACR
        run: |
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/emerald-app:latest

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------
      # DEPLOY EXACT IMAGE THAT AZURE EXPECTS
      # -------------------------------------------
      - name: Deploy to Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/emerald-app:latest
